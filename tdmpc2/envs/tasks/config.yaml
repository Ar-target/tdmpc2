defaults:
    - override hydra/launcher: submitit_local

hydra:
  run:
    dir: .

# ============================================================
# BeamNG
# ============================================================
beamng_host: localhost
beamng_port: 64256
beamng_home: /workspace/src/BeamNGtech
map: utah
vehicle_model: rockbouncer
vehicle_start_pos: 'auto'
vehicle_start_rot: [0.0, 0.0, 0.0, 1.0]
waypoint_file: "./waypoints.json"
npcs: []


# ============================================================
# environment
# ============================================================
task: beamng-offroad_driving
obs: state
episodic: true

# ============================================================
# evaluation
# ============================================================
checkpoint: ???
eval_episodes: 10
eval_freq: 50000

# ============================================================
# training
# ============================================================
steps: 10_000_000 # 10M
batch_size: 256

consistency_coef: 20
reward_coef: 0.1
value_coef: 0.1

termination_coef: 1

rho: 0.5
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 10
discount_min: 0.97
discount_max: 0.999
buffer_size: 1_000_000
exp_name: default
data_dir: ???

# ============================================================
# planning
# ============================================================
mpc: true

# MPPI迭代次数
iterations: 6

num_samples: 512
num_elites: 64
num_pi_trajs: 24

# horizon
horizon: 15

min_std: 0.05
max_std: 2
temperature: 1.0

# ============================================================
# actor
# ============================================================
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-3

# ============================================================
# critic
# ============================================================
num_bins: 101

vmin: -5
vmax: 80

# ============================================================
# architecture
# ============================================================
model_size: ???
num_enc_layers: 2
enc_dim: 256
num_channels: 32
mlp_dim: 512
latent_dim: 512
task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# ============================================================
# logging
# ============================================================
wandb_project: ???
wandb_entity: ???
wandb_silent: false
enable_wandb: true
save_csv: true

# ============================================================
# misc
# ============================================================
compile: false
save_video: false
save_agent: true
seed: 1

# ============================================================
# convenience
# ============================================================
work_dir: ???
task_title: ???
multitask: ???
tasks: ???

obs_shape: [18] # 观测维度: pos(3) + vel(3) + dir(3) + up(3) + rel(3) + next_rel(3)
action_dim: 2 # 动作维度: 方向盘 [-1, 1], 目标加速度踏板 [-1, 1]
episode_length: 500

seed_steps: 5000

bin_size: ???
